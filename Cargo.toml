[workspace]
resolver = "2"
members = ["members/*", "xtask"]
exclude = ["ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Giuliano Bellini <gyulyvgc99@gmail.com>"]

[workspace.dependencies]
nullnet-grpc-lib = { path = "members/nullnet-grpc-lib" }
nullnet-liberror = { git = "https://github.com/NullNet-ai/libguard.git", branch = "nullnet-liberror-print" }
tokio = "1.53.1"
serde = "1.0.229"
serde_json = "1.0"
toml = "1.1.4"
chrono = "0.4.45"
ipnetwork = "0.21.1"
notify = "8.2.0"
async-trait = "0.1.92"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
diesel = "2.3.12"
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
libsqlite3-sys = "0.38"
futures = "0.3.34"
clap = "4.6.0"
aes-gcm = { version = "0.11", features = ["rand_core"] }
openssl = "0.10.81"
ctrlc = "3.5.2"

[profile.release]
opt-level = 3
lto = true
strip = true
