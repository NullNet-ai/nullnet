# A dials B on 5555 with no proxy anywhere in the picture: the autonomous
# `backend_trigger` shape. Both timeouts are non-zero so the idle path is
# demonstrably armed and still never touches the direct edge.
[[services]]
name = "A"
timeout = 1
port = 8001
backends = ["B"]

[[services]]
name = "B"
port = 5555
timeout = 1

# A second initiator for the same backend target exercises independent holds.
[[services]]
name = "F"
timeout = 1
port = 8006
backends = ["B"]

[[services]]
name = "G"
timeout = 1
port = 8007
backends = ["Ghost"]
# An independent initiator into the same dep, so B keeps a client entry after
# A's hold is released.
[[services]]
name = "D"
timeout = 1
port = 8004
backends = ["B"]

[[services]]
name = "Ghost"
port = 7777
