syntax = "proto3";

package nullnet_grpc;

service NullnetGrpc {
  // TAP-based clients APIs --------------------------------------------------------------------------------------------

  // Network type declaration
  rpc NetworkType(Empty) returns (NetType);

  // Host report — the client sends its raw local observations (running
  // containers + listening processes); the server joins them against the
  // per-stack service config. The response carries the trigger ports the
  // caller should observe locally for the services it was matched to.
  rpc ServicesList(ServiceReport) returns (ServicesListResponse);

  // Control channel
  rpc ControlChannel(stream MsgId) returns (stream NetMessage);

  // Proxy-based clients APIs ------------------------------------------------------------------------------------------

  // Proxy
  rpc Proxy(ProxyRequest) returns (Upstream);

  // A front connection through the proxy closed. Pairs 1:1 with a preceding
  // successful Proxy call: the server keeps an open-connection count per proxy
  // client and only starts the idle grace once it reaches zero, so an edge is
  // never reaped under a live connection. proxy_ip is taken from remote_addr,
  // like Proxy itself.
  rpc ProxyConnectionClosed(ProxyConnectionEnd) returns (Empty);

  // Backend-triggered chains APIs -------------------------------------------------------------------------------------

  // Backend trigger — for service-to-service chains that do not involve the proxy.
  rpc BackendTrigger(BackendTriggerRequest) returns (Empty);

  // Egress trigger — for a registered service reaching the external internet,
  // brokered through the proxy's transparent forward listener.
  rpc EgressTrigger(EgressTriggerRequest) returns (Empty);

  // Egress liveness: the initiator's open-connection set crossed 0<->1. The
  // client is the only party that can see this — conntrack on the initiator
  // host is what knows whether a connection still exists. initiator_ip is taken
  // from remote_addr, so the pair identifies the same edge as EgressTrigger.
  rpc EgressLiveness(EgressLivenessReport) returns (Empty);

  // Report the external destinations a registered service contacted through its
  // egress edge. Distinct from EgressTrigger (which builds the edge once): the
  // client accumulates per-destination counts locally and flushes a batch
  // periodically, so the server holds a live per-service list with counts.
  rpc ReportEgressDestination(EgressDestinationReport) returns (Empty);

  // Per-flow egress country-policy check: the client holds the first packet of a
  // NEW external flow and asks whether the service may contact this destination.
  // The server resolves the destination's country (geo cache) and evaluates the
  // service's allowed_/blocked_countries lists. The client caches verdicts.
  rpc CheckEgressDestination(EgressPolicyCheck) returns (EgressPolicyVerdict);

  // Ingress country-policy check for a proxy-reachable service: the proxy asks
  // whether an external client (by source IP) may reach the named service. The
  // server resolves the client IP's country and evaluates the service's ingress
  // allowed_/blocked_countries lists. HTTP denials become a 403; raw tcp/udp
  // denials close the connection.
  rpc CheckIngress(IngressPolicyCheck) returns (IngressPolicyVerdict);

  // Report an event from a client or proxy agent back to the server.
  rpc ReportEvent(AgentEvent) returns (Empty);

  // TLS certificate distribution APIs ---------------------------------------------------------------------------------

  // Long-lived stream: the server pushes the full certificate set immediately on
  // subscribe (proxy startup load) and again whenever it changes, so every proxy
  // hot-reloads without a restart.
  rpc WatchCertificates(Empty) returns (stream CertBundle);

  // Port mapping distribution APIs ---------------------------------------------------------------------------------

  // Long-lived stream: the server pushes the full TCP/UDP port→service mapping
  // table immediately on subscribe and again whenever services.toml changes,
  // so the proxy opens/closes raw TCP/UDP listeners without a restart.
  rpc WatchPortMappings(Empty) returns (stream PortMappingBundle);

  // HTTP path-routing distribution APIs --------------------------------------------------------

  // Long-lived stream: the server pushes the full HTTP (host, path) → target
  // route table immediately on subscribe and again whenever services.toml
  // changes, so the proxy dispatches path-based routes/redirects without a
  // restart. See docs/http-path-routing-design.md.
  rpc WatchHttpRoutes(Empty) returns (stream HttpRouteBundle);
}

// TAP-based clients ---------------------------------------------------------------------------------------------------

message NetType {
   Net net = 1;
   // Host-NIC eBPF firewall policy, decided globally by the server (single point
   // of decision) and applied by the client at startup. Ports are u16 on the
   // wire's uint32. `egress_gateway` is derived server-side: true iff the caller
   // is the configured PROXY_IP (the egress boundary node), so clients no longer
   // carry an EGRESS_GATEWAY flag of their own.
   repeated uint32 ingress_allow_tcp_ports = 2;
   repeated uint32 ingress_allow_udp_ports = 3;
   repeated uint32 egress_allow_tcp_ports = 4;
   repeated uint32 egress_allow_udp_ports = 5;
   bool egress_gateway = 6;
}

enum Net {
  VXLAN = 0;
  VLAN = 1;
}

message NetMessage {
  oneof message {
    // VLAN setup and teardown
    VlanSetup vlan_setup = 1;
    VlanTeardown vlan_teardown = 2;
    // VXLAN setup and teardown
    VxlanSetup vxlan_setup = 3;
    VxlanTeardown vxlan_teardown = 4;
    // Docker container suspend (fire-and-forget) and resume (ack'd)
    ContainerSuspend container_suspend = 5;
    ContainerResume container_resume = 6;
    // Egress country-policy changed on the server (fire-and-forget)
    EgressPolicyChanged egress_policy_changed = 7;
  }
}

// A service's egress country lists changed on a config reload. The client
// drops its cached policy verdicts and flushes conntrack for its registered
// containers' external flows, so every live flow re-enters the NFQUEUE as NEW
// and is re-verdicted — flows the new policy denies die on their next packet.
message EgressPolicyChanged {}

// Pause an idle Docker container: the client runs `docker pause`. No ack —
// the server treats the replica as suspended optimistically.
message ContainerSuspend {
  string docker_container = 1;
}

// Resume a suspended Docker container: the client runs `docker unpause`,
// confirms it is running, then acks via `msg_id` so the server only returns
// the upstream to the proxy once the service is serving again.
message ContainerResume {
  MsgId msg_id = 1;
  string docker_container = 2;
}

message VlanSetup {
  MsgId msg_id = 1;
  uint32 vlan_id = 2;
  string local_veth = 3;
  string remote_veth = 4;
  string local_ip = 5;
  string remote_ip = 6;
  optional HostMapping host_mapping = 7;
  // Per-tunnel AES-256 key (32 raw bytes), generated once by the server and
  // sent identically to both endpoints. Used to encrypt/decrypt traffic in
  // the client's userspace VLAN forwarder (see forward/send.rs, forward/receive.rs).
  // Meaningless (placeholder zero bytes) when `encrypted` is false.
  bytes encryption_key = 8;
  // Whether this tunnel is encrypted, mirroring the server's ENCRYPTION_ENABLED
  // env var at the time this edge was set up. When false, the client skips
  // `encryption_key` entirely and forwards this VLAN's traffic in the clear.
  bool encrypted = 9;
}

message VlanTeardown {
  uint32 vlan_id = 1;
  // Acked once the teardown has actually run, so the server can hold the net id
  // out of the pool until this edge is really gone. Optional: a client that
  // predates this field simply never acks, and the server frees on its grace
  // timer instead.
  optional MsgId msg_id = 2;
}

message VxlanSetup {
  MsgId msg_id = 1;
  uint32 vxlan_id = 2;
  string ns_name = 3;
  string ns_net = 4;
  string br_name = 5;
  string br_net = 6;
  string local_ip = 7;
  string remote_ip = 8;
  optional HostMapping host_mapping = 9;
  optional string docker_container = 10;
  // Set only on the backend-entry edge of a backend-triggered chain.
  // The receiving client installs DNAT(dnat_port -> overlay_ip) so the
  // initiator's traffic on that local port is steered into the new VXLAN.
  optional uint32 dnat_port = 11;
  // Egress forward-proxy edge markers. Mutually exclusive with each other and
  // with dnat_port. Set on the initiator's edge: install policy-route + SNAT so
  // the service's external-bound traffic is steered into this VXLAN toward the
  // proxy (remote_ip) with the original destination preserved (no DNAT).
  optional bool egress_steer = 12;
  // Set on the gateway's edge: forward tunnelled external-bound packets to the
  // internet (kernel ip_forward + MASQUERADE); the Cilium egress-gateway model.
  optional bool egress_intercept = 13;
  // Per-tunnel AES-256 key (32 raw bytes), generated once by the server and
  // sent identically to both endpoints. Used as the XFRM/ESP SA key that
  // encrypts this tunnel's traffic at the kernel level. Meaningless
  // (placeholder zero bytes) when `encrypted` is false.
  bytes encryption_key = 14;
  // Per-tunnel VXLAN UDP destination port (replaces the IANA-standard 4789
  // default). Each tunnel gets a distinct port so an XFRM policy — which
  // selects by src/dst IP and port, not by VNI — can tell concurrent
  // tunnels between the same host pair apart. Allocated regardless of
  // `encrypted`, for simplicity.
  uint32 dstport = 15;
  // Whether this tunnel is encrypted, mirroring the server's ENCRYPTION_ENABLED
  // env var at the time this edge was set up. When false, the client skips
  // `encryption_key` and vxlan-setup.sh sets up a bare vxlan/veth link with no
  // XFRM SA/policy or MACsec.
  bool encrypted = 16;
}

message VxlanTeardown {
  uint32 vxlan_id = 1;
  string ns_name = 2;
  string br_name = 3;
  optional string docker_container = 4;
  // local_ip/remote_ip/dstport: needed to remove this tunnel's XFRM SA +
  // policy pair (same values used to install them in VxlanSetup).
  string local_ip = 5;
  string remote_ip = 6;
  uint32 dstport = 7;
  // Acked once the teardown has actually run, so the server can hold the net id
  // out of the pool until this edge is really gone. Optional: a client that
  // predates this field simply never acks, and the server frees on its grace
  // timer instead.
  optional MsgId msg_id = 8;
}

message MsgId {
  string id = 1;
}

// Raw local observations a client reports; the server joins them against the
// match keys in services/<stack>.toml. One observation may match many services.
message ServiceReport {
  repeated Container containers = 1;
  repeated Listener listeners = 2;
}

message Container {
  string match_key = 1;  // matched against a service's docker_container (Swarm label / container name)
  string real_name = 2;  // actual container name; stored as the replica identity
}

message Listener {
  string path = 1;  // /proc/<pid>/exe of the listening process; matched against process_path
}

// Response to ServicesList: per-declared-service, the set of trigger ports
// the client should observe via eBPF. When traffic is observed on one of
// these ports, the client fires BackendTrigger(service_name, port).
message ServicesListResponse {
  repeated ServiceTrigger service_triggers = 1;
}

message ServiceTrigger {
  string service_name = 1;
  repeated uint32 ports = 2;
  // Real container names hosting this service on the receiving node — the same
  // string space as the client's bridge-IP cache and as Container.real_name.
  // Scopes the trigger to its own replicas; empty means a server that predates
  // this field, and the client then falls back to matching any container.
  repeated string containers = 3;
}

message HostMapping {
  string ip = 1;
  string name = 2;
}

// Proxy-based clients -------------------------------------------------------------------------------------------------

message ProxyRequest {
  string client_ip = 1;
  string service_name = 2;
}

message Upstream {
  string ip = 1;
  uint32 port = 2;
}

// Close half of the ingress open-connection count. Keyed on the *client*
// identity, not the resolved upstream: under max_networks/sticky reuse many
// clients share one upstream, so the upstream cannot identify the counter.
message ProxyConnectionEnd {
  string client_ip = 1;
  string service_name = 2;
}

// Protocol a proxy-reachable service is exposed over. HTTP is routed by Host
// header on the shared 80/443 listeners; TCP/UDP each get a dedicated
// listen_port the proxy binds directly.
enum ServiceProtocol {
  HTTP = 0;
  TCP = 1;
  UDP = 2;
}

// One entry in the live port→service table. Only services with a non-HTTP
// protocol need an entry — HTTP stays on the existing Host-header routing.
message PortMapping {
  string service_name = 1;
  ServiceProtocol protocol = 2;
  uint32 listen_port = 3;
  // Mirrors the service's configured per-client idle timeout (0 disables
  // it), so the proxy can expire UDP sessions without a second timeout
  // mechanism.
  uint64 idle_timeout_secs = 4;
}

message PortMappingBundle {
  repeated PortMapping mappings = 1;
}

// HTTP path routing ----------------------------------------------------------------------------

// One location-block-style dispatch rule for HTTP(S): within a host, the
// entry with the longest `path_prefix` that prefix-matches the request path
// wins. `path_prefix = "/"` is the catch-all. Target is mutually exclusive:
// either proxy_pass to an existing HTTP service (resolved exactly like a
// Host-routed service is today) or a literal redirect.
message HttpRoute {
  string host = 1;
  string path_prefix = 2;
  oneof target {
    string service_name = 3;
    HttpRedirect redirect = 4;
  }
  // Only meaningful when `target` is `service_name`: strip the matched
  // `path_prefix` from the path forwarded to the backend — the NGINX
  // `proxy_pass http://backend/;` trailing-slash equivalent. `false`
  // (default) forwards the original request path unchanged.
  bool strip_prefix = 5;
}

// A literal redirect target for an HttpRoute. `to` is either an absolute URL
// (used verbatim) or a path (starting with `/`; same scheme/host as the
// incoming request, target path substituted).
message HttpRedirect {
  string to = 1;
  // One of 301/302/307/308.
  uint32 status_code = 2;
  // Append the request path's suffix beyond the matched `path_prefix` to
  // `to` — the NGINX `rewrite ^/old(.*) /new$1 permanent;` equivalent.
  // `false` (default) uses `to` verbatim, same as before this field existed.
  bool preserve_path = 3;
  // Append the original request's query string to the final redirect
  // target (merged with `?`/`&` if `to` already carries its own query).
  bool preserve_query = 4;
}

message HttpRouteBundle {
  repeated HttpRoute routes = 1;
}

// Backend-triggered chains --------------------------------------------------------------------------------------------

// Egress edge liveness, reported only on transitions — not per flow.
message EgressLivenessReport {
  // Docker container of the initiator, empty for a host process. Together with
  // the sender's IP this is the same key EgressTrigger builds the edge under.
  string initiator_container = 1;
  // true  = first connection opened (0 -> 1)
  // false = last connection closed (1 -> 0), and the flows are provably gone,
  //         not merely idle. The server still waits out a short debounce before
  //         reaping, because how promptly conntrack reports a close depends on
  //         which peer hung up first.
  bool active = 2;
}

message BackendTriggerRequest {
  string service_name = 1;
  // The trigger port observed by the client. Picks one chain among the
  // service's configured triggers (one chain per port).
  uint32 port = 2;
  // Real Docker container name of the initiator replica that fired the
  // trigger. Empty when the initiator is a host process (no docker context),
  // in which case the server falls back to picking the first replica matching
  // sender_ip. With docker, this disambiguates the replica when multiple
  // replicas of the same service live on the same host.
  string initiator_container = 3;
}

// Egress trigger — fired by the client on the first NEW flow from a registered
// service to an external (non-nullnet) destination. The server builds (or reuses)
// a single per-host egress VXLAN edge to the proxy; the destination is preserved
// in-band, so one edge serves all of that service's external destinations.
message EgressTriggerRequest {
  string service_name = 1;
  // Real Docker container name of the initiator replica. Empty for a host
  // process; disambiguates co-located replicas otherwise (as in BackendTrigger).
  string initiator_container = 2;
  // Observed external destination — for logging / future policy only; the edge
  // itself is destination-agnostic.
  string dst_ip = 3;
  uint32 dst_port = 4;
}

// Egress destination report — a periodic batch flush from the client. Each entry
// is one external destination with a client-side running connection count and the
// latest contact time. The server keys each entry to the service's egress edge by
// (sender_ip, initiator_container) and stores the client-provided values verbatim
// (the client is the sole reporter for its own edge).
message EgressDestinationReport {
  repeated EgressDestinationEntry entries = 1;
}

message EgressDestinationEntry {
  // Real Docker container name of the initiator replica. Empty for a host
  // process; disambiguates co-located replicas otherwise (as in EgressTrigger).
  string initiator_container = 1;
  string dst_ip = 2;
  // Running count of NEW connections the client observed to this destination.
  uint64 count = 3;
  // Epoch seconds of the most recent connection to this destination.
  uint64 last_seen = 4;
  // Whether the latest attempt was denied by the egress country policy.
  bool blocked = 5;
}

// Egress country-policy check for one held first-packet: which registered
// replica wants to reach which external destination.
message EgressPolicyCheck {
  // Real Docker container name of the initiator replica (as in EgressTrigger).
  string initiator_container = 1;
  string dst_ip = 2;
}

message EgressPolicyVerdict {
  bool allowed = 1;
}

message IngressPolicyCheck {
  string service_name = 1;
  string client_ip = 2;
}

message IngressPolicyVerdict {
  bool allowed = 1;
}

// TLS certificates ----------------------------------------------------------------------------------------------------

// A single TLS certificate, keyed by the SNI name it serves (exact, e.g.
// "color.com", or wildcard, e.g. "*.color.com").
message TlsCertificate {
  string domain = 1;
  // Leaf certificate followed by any intermediates, PEM-encoded.
  string fullchain_pem = 2;
  // PEM-encoded private key. At-rest encryption (CERT_ENCRYPTION_KEY,
  // AES-256-GCM) is applied server-side; the key is decrypted before it lands here.
  string key_pem = 3;
}

// The full certificate set. Sent in whole on every WatchCertificates push
// (the proxy rebuilds its store from the snapshot).
message CertBundle {
  repeated TlsCertificate certificates = 1;
}

// Misc ----------------------------------------------------------------------------------------------------------------

message Empty { }

// Agent event report — sent from nullnet-client or nullnet-proxy to the server.
message AgentEvent {
  oneof event {
    // Client error events
    AgentVxlanSetupFailed       vxlan_setup_failed       = 1;
    AgentVlanSetupFailed        vlan_setup_failed        = 2;
    AgentVxlanTeardownFailed    vxlan_teardown_failed    = 3;
    AgentVlanTeardownFailed     vlan_teardown_failed     = 4;
    AgentDnatInstallFailed      dnat_install_failed      = 5;
    AgentDnatRemovalFailed      dnat_removal_failed      = 6;
    AgentHostMappingFailed      host_mapping_failed      = 7;
    AgentControlChannelClosed   control_channel_closed   = 8;
    AgentControlChannelAckFailed control_channel_ack_failed = 9;
    AgentServicesListUpdateFailed services_list_update_failed = 10;
    AgentBackendTriggerSendFailed backend_trigger_send_failed = 11;
    AgentFirewallRulesLoadFailed  firewall_rules_load_failed  = 12;
    AgentContainerSuspendFailed   container_suspend_failed    = 24;
    AgentContainerResumeFailed    container_resume_failed     = 25;
    AgentEgressTriggerSendFailed  egress_trigger_send_failed  = 30;
    AgentGatewayForwardInstallFailed gateway_forward_install_failed = 31;
    AgentBackendTriggerSetupTimedOut backend_trigger_setup_timed_out = 32;
    AgentEgressSteerSetupTimedOut egress_steer_setup_timed_out = 33;
    AgentEgressSteerInstallFailed egress_steer_install_failed = 34;
    AgentNfqueueBindFailed        nfqueue_bind_failed        = 35;
    AgentMssClampInstallFailed    mss_clamp_install_failed   = 36;
    AgentEgressPolicyCheckFailed  egress_policy_check_failed = 37;
    AgentConntrackFlushFailed     conntrack_flush_failed     = 38;
    // Client info events
    AgentVxlanSetupCompleted      vxlan_setup_completed      = 13;
    AgentVlanSetupCompleted       vlan_setup_completed       = 14;
    AgentControlChannelEstablished control_channel_established = 15;
    AgentServicesListUpdated      services_list_updated      = 16;
    // Proxy error events
    AgentUpstreamLookupFailed     upstream_lookup_failed     = 17;
    AgentProxyRequestMissingHost  proxy_request_missing_host = 18;
    AgentProxyRequestInvalidHost  proxy_request_invalid_host = 19;
    AgentUpstreamIpParseFailed    upstream_ip_parse_failed   = 20;
    AgentProxyClientNotInet       proxy_client_not_inet      = 21;
    AgentTlsCertificateInvalid    tls_certificate_invalid    = 23;
    AgentTcpListenerBindFailed    tcp_listener_bind_failed   = 26;
    AgentUdpListenerBindFailed    udp_listener_bind_failed   = 27;
    AgentTcpUpstreamConnectFailed tcp_upstream_connect_failed = 28;
    AgentUdpUpstreamConnectFailed udp_upstream_connect_failed = 29;
    // Proxy info events
    AgentProxyRequestRouted       proxy_request_routed       = 22;
  }
}

message AgentVxlanSetupFailed       { uint32 vxlan_id = 1; string ns_name = 2; int32 error_code = 3; }
message AgentVlanSetupFailed        { uint32 vlan_id = 1; string local_veth = 2; string error_reason = 3; }
message AgentVxlanTeardownFailed    { uint32 vxlan_id = 1; string ns_name = 2; int32 error_code = 3; }
message AgentVlanTeardownFailed     { uint32 vlan_id = 1; string error_reason = 2; }
message AgentDnatInstallFailed      { uint32 port = 1; string overlay_ip = 2; }
message AgentDnatRemovalFailed      { uint32 port = 1; string overlay_ip = 2; }
message AgentHostMappingFailed      { string hostname = 1; string ip = 2; optional string docker_container = 3; }
message AgentControlChannelClosed   {}
message AgentControlChannelAckFailed { string msg_id = 1; string message_type = 2; }
message AgentServicesListUpdateFailed { string error_message = 1; uint32 num_services = 2; }
message AgentBackendTriggerSendFailed { string service_name = 1; uint32 port = 2; string error_message = 3; }
message AgentFirewallRulesLoadFailed  { string path = 1; string error_message = 2; }
message AgentContainerSuspendFailed  { string docker_container = 1; string error_message = 2; }
message AgentContainerResumeFailed   { string docker_container = 1; string error_message = 2; }
message AgentEgressTriggerSendFailed { string service_name = 1; string dst_ip = 2; uint32 dst_port = 3; string error_message = 4; }
message AgentGatewayForwardInstallFailed { uint32 vxlan_id = 1; string br_net = 2; }
message AgentBackendTriggerSetupTimedOut { string service_name = 1; uint32 port = 2; string docker_container = 3; string error_message = 4; }
message AgentEgressSteerSetupTimedOut { string docker_container = 1; string dst_ip = 2; uint32 dst_port = 3; string error_message = 4; }
message AgentEgressSteerInstallFailed { uint32 vxlan_id = 1; optional string docker_container = 2; string error_message = 3; }
message AgentNfqueueBindFailed      { uint32 queue_id = 1; string error_message = 2; }
message AgentMssClampInstallFailed  { string error_message = 1; }
message AgentEgressPolicyCheckFailed { string docker_container = 1; string dst_ip = 2; string error_message = 3; }
message AgentConntrackFlushFailed   { string ip = 1; string error_message = 2; }
message AgentVxlanSetupCompleted    { uint32 vxlan_id = 1; string ns_name = 2; }
message AgentVlanSetupCompleted     { uint32 vlan_id = 1; }
message AgentControlChannelEstablished {}
message AgentServicesListUpdated    { uint32 num_services = 1; }
message AgentUpstreamLookupFailed   { string service_name = 1; string client_ip = 2; string error_message = 3; }
message AgentProxyRequestMissingHost { string client_ip = 1; }
message AgentProxyRequestInvalidHost { string client_ip = 1; }
message AgentUpstreamIpParseFailed  { string raw_ip = 1; string service_name = 2; }
message AgentProxyClientNotInet     { string address_family = 1; }
message AgentTlsCertificateInvalid  { string domain = 1; string reason = 2; }
message AgentProxyRequestRouted     { string service_name = 1; string client_ip = 2; string upstream_ip = 3; uint64 latency_ms = 4; }
message AgentTcpListenerBindFailed  { uint32 listen_port = 1; string service_name = 2; string error_message = 3; }
message AgentUdpListenerBindFailed  { uint32 listen_port = 1; string service_name = 2; string error_message = 3; }
message AgentTcpUpstreamConnectFailed { string service_name = 1; string client_ip = 2; string error_message = 3; }
message AgentUdpUpstreamConnectFailed { string service_name = 1; string client_ip = 2; string error_message = 3; }